# Managed by secure-agent-workflow bootstrap. Change the template in
# secure-agent-workflow/bootstrap/files/credential-check.yml and re-run
# bootstrap, not this copy. `bootstrap.sh <repo> --update-gate <sha>` moves the pin.
#
# Daily credential check (#55, ADR-007). Opens, updates or closes one issue
# labeled `credentials`. Does nothing in a repo without infra/credentials.yml.
# Run it now from the Actions tab (workflow_dispatch on the default branch).
#
# A plain workflow, not a call to a reusable one: a called workflow gets the
# environment's variables but its secrets arrive empty unless the caller passes
# `secrets: inherit`, which hands it every repo secret. The code it runs still
# comes from the pinned commit below.
#
# The staging environment is used with `deployment: false`: a daily check isn't
# a deploy, and a deployment record would show up in staging's deployment
# history, which rollback reads (ADR-009). Staging's branch policy still
# applies, and a scheduled run's ref is the default branch, which staging allows.
#
# GitHub disables scheduled workflows in a public repo after 60 days without
# activity; re-enable it from the Actions tab.

name: credential-check

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Repos without a manifest have nothing to check. This job needs no
  # environment, so they never touch staging or AWS.
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Look for infra/credentials.yml
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/contents/infra/credentials.yml" --silent 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No infra/credentials.yml on the default branch; nothing to check."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: manifest
    if: needs.manifest.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      # secure-agent-workflow at the pinned commit. Nothing from this repo runs;
      # its manifest is read through the API.
      - name: Check out the credential check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: {{GATE_REPO}}
          ref: {{GATE_SHA}}
          path: .credential-check
          persist-credentials: false

      # One step, so the role's credentials exist only in this step's process.
      - name: Check credentials as the staging role
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .credential-check/deploy/credentials/daily-check.sh
