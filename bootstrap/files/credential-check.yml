# Managed by secure-agent-workflow bootstrap. Change the template in
# secure-agent-workflow/bootstrap/files/credential-check.yml and re-run
# bootstrap, not this copy. `bootstrap.sh <repo> --update-gate <sha>` moves the pin.
#
# Daily credential check (#55, ADR-007). Opens, updates or closes one issue
# labeled `credentials`. Does nothing in a repo without infra/credentials.yml.
# Run it now from the Actions tab (workflow_dispatch on the default branch).
#
# GitHub disables scheduled workflows in a public repo after 60 days without
# activity; re-enable it from the Actions tab.

name: credential-check

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  credentials:
    uses: {{GATE_REPO}}/.github/workflows/credential-check.yml@{{GATE_SHA}}
    # The check job reads staging's AWS_ROLE_ARN. A called workflow gets
    # environment secrets only when the caller passes secrets; without this the
    # ARN is empty. It hands the repo's secrets to the pinned workflow above.
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
