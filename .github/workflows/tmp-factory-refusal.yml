# Temporary test for #75, removed before merge: a PR run must not get the factory
# environment. GitHub should refuse this job before any step runs.
name: tmp-factory-refusal

on:
  pull_request:

permissions: {}

jobs:
  use-factory:
    runs-on: ubuntu-latest
    environment: factory
    permissions:
      contents: read
    steps:
      - name: Must not run
        run: echo "FAIL  a PR run got the factory environment"
