# Daily credential check (#55, ADR-007). Reusable: a consumer repo calls it on a
# schedule, pinned to a commit SHA of this repo. bootstrap installs the caller.
#
# Runs `credentials.py check --issue` as the consumer's staging role, so it
# reads the dev target's preview and staging credentials and nothing else. It
# opens one issue labeled `credentials` when a credential fails, expires within
# 14 days or is past rotate_days, updates it on later runs, and closes it when
# everything passes. Values are masked before any checker runs.
#
# The staging environment is used for its AWS_ROLE_ARN secret and its OIDC
# subject, with `deployment: false`: a daily check isn't a deploy, and a
# deployment record would show up in staging's deployment history, which
# rollback reads (ADR-009). The environment's branch policy still applies, and
# a scheduled run's ref is the default branch, which staging allows.
#
# The caller must pass `secrets: inherit`. A called workflow gets the
# environment's variables without it, but its secrets arrive empty.

name: credential-check

on:
  workflow_call:

permissions: {}

jobs:
  # Repos without a manifest have nothing to check. This job needs no
  # environment, so they never touch staging or AWS.
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Look for infra/credentials.yml
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/contents/infra/credentials.yml" --silent 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No infra/credentials.yml on the default branch; nothing to check."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: manifest
    if: needs.manifest.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      # This repo at the commit the caller pinned. Nothing from the consumer
      # repo runs; its manifest is read through the API.
      - name: Check out the credential check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .credential-check
          persist-credentials: false

      # One step, so the role's credentials exist only in this step's process.
      - name: Check credentials as the staging role
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE" ]; then
            echo "FAIL  AWS_ROLE_ARN is empty. Either the caller lacks 'secrets: inherit' (re-run bootstrap)"
            echo "      or staging has no AWS_ROLE_ARN secret (run: broker.sh add-repo $REPO)"
            exit 1
          fi
          echo "::add-mask::$ROLE"
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" \
            --role-session-name "credential-check-$GITHUB_RUN_ID" --web-identity-token "$oidc" \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$creds"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          python3 .credential-check/deploy/credentials/credentials.py check "$REPO" --issue
