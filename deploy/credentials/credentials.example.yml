# Example infra/credentials.yml for a Cloudflare consumer (ADR-007).
# Copy to the consumer repo's infra/credentials.yml. It is tier 2: the agent may
# propose an entry, the approver merges it, and the operator stores the value
# with `broker.sh set <owner>/<repo> <name>`.
#
# Fields:
#   name         parameter name, lowercase and hyphens; *-account-id is reserved
#   system       picks the checker, deploy/credentials/checks/<system>
#   account      dev or prod
#   exposure     dev: preview (PR code can read it) or staging (merged code only); prod: prod
#   purpose      why the pipeline needs it
#   permissions  what to grant when creating it; the checklist the checker can't fully verify
#   check        arguments for the checker. Cloudflare: workers kv r2 d1 queues zones
#   rotate_days  optional; status warns when the stored value is older
#
# Cloudflare tokens: My Profile > API Tokens > Create Custom Token. Account
# Resources: the dev account only. Zone Resources: none. The checker records the
# account as cloudflare-account-id, so you never type it.

credentials:
  - name: cloudflare-deploy-token
    system: cloudflare
    account: dev
    exposure: preview
    purpose: Deploy preview and staging Workers
    permissions: "Account > Workers Scripts > Edit; Account > Account Settings > Read"
    check: workers
    rotate_days: 90

  - name: cloudflare-read-token
    system: cloudflare
    account: dev
    exposure: preview
    purpose: OpenTofu plan on PRs, read-only
    permissions: "Account > Workers Scripts, Workers KV Storage, D1, Account Settings > Read (add R2 and Queues if the app uses them)"
    check: workers kv d1
    rotate_days: 90

  - name: cloudflare-infra-token
    system: cloudflare
    account: dev
    exposure: staging
    purpose: OpenTofu apply and D1 migrations on merge to main
    permissions: "Account > Workers KV Storage, D1 > Edit; Account Settings > Read (add R2 and Queues if the app uses them)"
    check: kv d1
    rotate_days: 90
