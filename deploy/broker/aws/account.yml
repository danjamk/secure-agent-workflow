AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  secure-agent-workflow credential broker, account level (ADR-002, ADR-006).
  The GitHub OIDC identity provider and the OpenTofu state bucket. Deployed
  once per AWS account by broker.sh account.

Parameters:
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      ARN of a GitHub OIDC provider that already exists in this account.
      AWS allows one provider per URL, so an existing one is reused instead
      of created. Empty creates it.

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # OpenTofu state for every consumer repo, keyed <repo>/<dev|prod>/terraform.tfstate.
  # Retained when the stack is deleted: losing state orphans real resources.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub saw-tfstate-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub ${StateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  OidcProviderArn:
    Value: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
    Export:
      Name: saw-broker-oidc-provider-arn
  StateBucketName:
    Value: !Ref StateBucket
    Export:
      Name: saw-broker-state-bucket
